<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>S.T.O.P. Alarm Proposal</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STOP Proposals">
<meta name="theme-color" content="#152a45">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{
    --navy:#152a45;
    --navy-2:#1f3b5c;
    --red:#c8202b;
    --blue:#1c4fa0;
    --paper:#faf9f6;
    --line:#dcdad3;
    --ink:#20242b;
    --muted:#6b7078;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:640px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.04);display:flex;flex-direction:column;}

  .topbar{background:var(--navy);color:#fff;padding:18px 18px 0 18px;position:sticky;top:0;z-index:10;}
  .brand{display:flex;flex-direction:column;line-height:1.15;}
  .back-link{background:none;border:none;color:#b9c6da;font-size:12.5px;font-weight:600;padding:0;cursor:pointer;text-align:left;}
  .back-link:active{color:#fff;}
  .type-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff;}
  .type-card-top{margin-bottom:4px;}
  .type-card-top .type-name-input{font-size:16px;font-weight:700;color:var(--navy);border:none;border-bottom:1.5px dashed #c9c6bc;padding:2px 0 4px 0;width:100%;background:transparent;}
  .type-card-top .type-name-input:focus{border-bottom-color:var(--blue);border-bottom-style:solid;}
  .type-card-meta{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .type-card-actions{display:flex;gap:8px;}
  .brand .s1{font-size:11px;letter-spacing:.14em;color:#9fb3cc;font-weight:600;}
  .brand .s2{font-size:19px;font-weight:800;letter-spacing:.01em;}
  .brand .s2 span{color:var(--red);}
  .tabs{display:flex;gap:2px;margin-top:16px;}
  .tab{flex:1;text-align:center;padding:11px 6px;font-size:13.5px;font-weight:600;color:#b9c6da;background:transparent;border:none;cursor:pointer;border-bottom:3px solid transparent;}
  .tab.active{color:#fff;border-bottom:3px solid var(--red);}

  main{flex:1;padding:18px 18px 100px 18px;}

  h2.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:26px 0 10px 0;font-weight:700;}
  h2.section-title:first-child{margin-top:4px;}

  .card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff;}

  label{display:block;font-size:13px;font-weight:600;color:var(--navy-2);margin:0 0 5px 0;}
  input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;
    font-size:16px;color:var(--ink);background:#fff;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .scope-row{border-bottom:1px solid #eee;padding:10px 0;}
  .scope-row:last-child{border-bottom:none;}
  .scope-main{display:flex;align-items:center;gap:10px;}
  .scope-main input[type=checkbox],.scope-main input[type=radio]{width:19px;height:19px;flex:none;accent-color:var(--blue);}
  .scope-main .opt-label{flex:1;font-size:15px;}
  .scope-main .opt-price{font-size:13px;color:var(--muted);}
  .scope-detail{margin:8px 0 0 29px;display:flex;gap:10px;align-items:flex-start;}
  .scope-detail .qty-wrap{flex:none;width:64px;}
  .scope-detail .qty-wrap label,.scope-detail .bullets-wrap label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px;display:block;}
  .scope-detail .bullets-wrap{flex:1;}
  .scope-detail input[type=number]{padding:8px;font-size:14px;}
  .bullet-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .bullet-row input.bullet-line-input{flex:1;font-size:13px;padding:8px 9px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;}
  .bullet-suggest-wrap{position:relative;flex:1;}
  .bullet-suggest-wrap input{width:100%;}
  .bullet-suggest-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--line);border-radius:8px;margin-top:4px;max-height:190px;overflow-y:auto;z-index:35;box-shadow:0 8px 22px rgba(0,0,0,.16);display:none;}
  .bullet-suggest-item{padding:10px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #f0efe9;}
  .bullet-suggest-item:last-child{border-bottom:none;}
  .bullet-suggest-item:active{background:#f4f2ec;}
  .bullet-row .bullet-line-rm{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid #f0c6c8;background:#fff;color:var(--red);font-size:14px;line-height:1;cursor:pointer;}
  .bullet-row .bullet-line-add{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid #c7d7ee;background:#eef3fb;color:var(--blue);font-size:15px;line-height:1;cursor:pointer;font-weight:700;}
  .addon-row{display:flex;gap:6px;align-items:center;margin:0 0 8px 20px;}
  .addon-row select.bullet-addon-select{flex:1;font-size:12.5px;padding:7px 8px;border:1.5px solid var(--line);border-radius:7px;font-family:inherit;}
  .addon-row input.bullet-addon-qty{width:46px;flex:none;padding:7px 4px;font-size:12.5px;text-align:center;border:1.5px solid var(--line);border-radius:7px;}
  .addon-row .bullet-addon-rm{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid #f0c6c8;background:#fff;color:var(--red);font-size:13px;line-height:1;cursor:pointer;}
  .bullet-add-btn{padding:8px !important;font-size:12.5px !important;margin-top:0 !important;}
  .save-lib-btn{flex:none;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:6px;border:1px solid var(--blue);background:#eef3fb;color:var(--blue);cursor:pointer;white-space:nowrap;}

  .price-badge{font-size:12px;color:var(--muted);font-weight:600;}

  .summary-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14.5px;gap:10px;}
  .summary-line .l{color:var(--navy-2);font-weight:600;flex:1;}
  .summary-line input[type=number]{width:120px;text-align:right;padding:8px 10px;}

  .btn{display:block;width:100%;text-align:center;padding:14px 16px;border-radius:9px;font-size:15.5px;font-weight:700;border:none;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:active{background:#a91822;}
  .btn-primary:disabled{background:#d9a3a6;cursor:not-allowed;}
  .btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn-ghost:disabled{color:var(--muted);cursor:not-allowed;}
  .btn-danger-ghost{background:#fff;color:var(--red);border:1.5px solid #f0c6c8;font-weight:600;font-size:13px;padding:8px 12px;width:auto;}

  .footer-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom)) 18px;}

  .cat-block{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;}
  .cat-head{background:#f4f2ec;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .cat-head input[type=text]{font-weight:700;font-size:15px;border:none;background:transparent;padding:2px 0;width:auto;flex:1;}
  .cat-body{padding:10px 14px;}
  .cat-opts-row{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);padding:0 14px 10px 14px;align-items:center;}
  .cat-opts-row label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600;margin:0;}
  .cat-opts-row select{width:auto;font-size:12.5px;padding:4px 8px;}
  .cat-opts-row input[type=checkbox]{width:15px;height:15px;}

  .admin-opt{padding:9px 0;border-bottom:1px dashed #eee;}
  .admin-opt:last-child{border-bottom:none;}
  .admin-opt-top{display:flex;align-items:center;gap:8px;}
  .admin-opt-top input[type=text]{flex:1;font-size:14px;padding:8px 10px;}
  .admin-opt-top input.price{width:78px;flex:none;text-align:right;}
  .admin-opt-top .rm{flex:none;width:30px;height:30px;border-radius:7px;border:1px solid #f0c6c8;background:#fff;color:var(--red);font-size:16px;line-height:1;cursor:pointer;}
  .admin-opt textarea{margin-top:6px;font-size:12.5px;min-height:40px;}
  .admin-opt .bullets-label{font-size:10.5px;color:var(--muted);margin:6px 0 3px 0;font-weight:600;}
  .add-opt-btn{margin-top:6px;background:none;border:1.5px dashed #c9c6bc;color:var(--navy-2);border-radius:8px;padding:9px;width:100%;font-size:13.5px;font-weight:600;cursor:pointer;}
  .quick-add-row{display:flex;gap:6px;margin-top:6px;}
  .quick-add-row select{flex:1;font-size:12.5px;padding:7px 8px;}
  .quick-add-row button{flex:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:7px;border:1px solid var(--blue);background:#eef3fb;color:var(--blue);cursor:pointer;}
  .lib-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
  .lib-row input[type=text]{flex:1;font-size:14px;padding:8px 10px;}
  .add-cat-btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:12px;width:100%;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:6px;}
  .move-btns{display:flex;flex-direction:column;gap:2px;flex:none;}
  .move-btns button{width:26px;height:22px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--navy-2);font-size:11px;line-height:1;cursor:pointer;padding:0;}
  .move-btns button:disabled{opacity:0.3;cursor:default;}
  .admin-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;position:sticky;top:0;background:#fff;padding:10px 0;z-index:5;border-bottom:1px solid var(--line);}
  .admin-nav button{flex:none;width:40px;height:40px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:16px;cursor:pointer;}
  .admin-nav button:disabled{opacity:0.3;cursor:default;}
  .admin-nav-label{flex:1;text-align:center;font-size:13.5px;font-weight:700;color:var(--navy);}
  .admin-nav-label .idx{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:1px;}
  .admin-jump{width:auto;font-size:12px;padding:4px 6px;margin-left:6px;flex:none;}

  .empty{color:var(--muted);font-size:13.5px;padding:16px 4px;text-align:center;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:88%;text-align:center;}
  .toast.show{opacity:1;}

  .loading-row{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px;font-size:13.5px;color:var(--muted);}
  .quick-icon-dock{position:fixed;left:34px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;gap:10px;z-index:40;max-width:120px;}
  .quick-dock-toggle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:41;width:20px;height:56px;border:none;border-top-right-radius:10px;border-bottom-right-radius:10px;background:var(--navy);color:#fff;font-size:12px;font-weight:800;cursor:pointer;box-shadow:2px 2px 10px rgba(0,0,0,.2);padding:0;}
  .quick-dock-toggle:active{background:var(--navy-2);}
  .quick-icon-btn{position:relative;min-width:48px;height:44px;padding:0 10px;border-radius:14px;background:var(--navy);color:#fff;border:2px solid #fff;font-size:12.5px;font-weight:800;letter-spacing:.01em;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;white-space:nowrap;}
  .quick-icon-btn:active{background:var(--navy-2);}
  .quick-icon-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;}
  .quick-counter-row{display:flex;align-items:stretch;background:var(--navy);border:2px solid #fff;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.25);overflow:hidden;}
  .quick-counter-btn{flex:none;width:30px;border:none;background:transparent;color:#fff;font-size:19px;font-weight:800;cursor:pointer;line-height:1;padding:0;}
  .quick-counter-btn:active{background:rgba(255,255,255,.18);}
  .quick-counter-display{flex:none;min-width:36px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
  .quick-counter-glyph{font-size:9px;font-weight:700;opacity:.85;line-height:1.1;white-space:nowrap;}
  .quick-counter-num{font-size:15px;font-weight:800;line-height:1.15;}
  .quick-modal-backdrop{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
  .quick-modal-sheet{background:#fff;width:100%;max-width:560px;max-height:82vh;overflow-y:auto;border-radius:16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom)) 16px;}
  .quick-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:0;background:#fff;padding-bottom:6px;}
  .quick-modal-title{font-weight:800;font-size:16.5px;color:var(--navy);}
  .quick-modal-close{background:var(--red);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .quick-modal-opt{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #eee;font-size:15px;cursor:pointer;}
  .quick-modal-opt input{width:20px;height:20px;flex:none;accent-color:var(--blue);}
  .quick-modal-price{margin-left:auto;color:var(--muted);font-size:13px;flex:none;}
  .quick-modal-empty{color:var(--muted);font-size:13.5px;padding:14px 4px;text-align:center;}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid #ddd;border-top-color:var(--blue);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<div class="app" id="app"></div>

/* ---------------- STANDALONE STORAGE SHIM ----------------
   window.storage only exists inside a Claude.ai artifact. When this file
   is hosted anywhere else (e.g. on Railway, or opened as a plain webpage),
   we fall back to a localStorage cache plus an optional sync backend so
   the app still works fully offline and can sync across devices. */
const IS_CLAUDE_STORAGE = !!window.storage;

function getSyncSettings(){
  try{
    return {
      apiBase: (localStorage.getItem("SYNC_API_BASE")||"").trim().replace(/\/$/,""),
      apiKey: (localStorage.getItem("SYNC_API_KEY")||"").trim()
    };
  }catch(e){ return { apiBase:"", apiKey:"" }; }
}

if(!IS_CLAUDE_STORAGE){
  window.storage = {
    async get(key, shared){
      const { apiBase, apiKey } = getSyncSettings();
      if(apiBase){
        try{
          const res = await fetch(`${apiBase}/api/kv/${encodeURIComponent(key)}`, {
            headers: { "x-api-key": apiKey }
          });
          if(res.ok){
            const data = await res.json();
            if(data.value !== null && data.value !== undefined){
              try{ localStorage.setItem("cache:"+key, data.value); }catch(e){}
              return { key, value: data.value, shared };
            }
          }
        }catch(e){ /* offline — fall through to local cache */ }
      }
      try{
        const local = localStorage.getItem("cache:"+key);
        if(local !== null) return { key, value: local, shared };
      }catch(e){}
      return null;
    },
    async set(key, value, shared){
      try{ localStorage.setItem("cache:"+key, value); }catch(e){}
      const { apiBase, apiKey } = getSyncSettings();
      if(apiBase){
        try{
          await fetch(`${apiBase}/api/kv/${encodeURIComponent(key)}`, {
            method: "PUT",
            headers: { "x-api-key": apiKey, "Content-Type": "application/json" },
            body: JSON.stringify({ value })
          });
        }catch(e){ /* saved locally; will sync next time there's a connection */ }
      }
      return { key, value, shared };
    },
    async delete(key, shared){
      try{ localStorage.removeItem("cache:"+key); }catch(e){}
      const { apiBase, apiKey } = getSyncSettings();
      if(apiBase){
        try{
          await fetch(`${apiBase}/api/kv/${encodeURIComponent(key)}`, {
            method: "DELETE",
            headers: { "x-api-key": apiKey }
          });
        }catch(e){}
      }
      return { key, deleted: true, shared };
    },
    async list(prefix, shared){
      const keys = [];
      try{
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith("cache:")){
            const real = k.slice(6);
            if(!prefix || real.startsWith(prefix)) keys.push(real);
          }
        }
      }catch(e){}
      return { keys, prefix, shared };
    }
  };
}

function uid(){ return "id" + Math.random().toString(36).slice(2,9); }

function alphaSort(arr){
  return arr.slice().sort((a,b)=> String(a).localeCompare(String(b), undefined, {sensitivity:'base'}));
}
function alphaSortWithIndex(arr){
  return arr.map((v,i)=>({v,i})).sort((a,b)=> String(a.v).localeCompare(String(b.v), undefined, {sensitivity:'base'}));
}
function alphaSortWithIndexBlanksLast(arr){
  const withIdx = arr.map((v,i)=>({v,i}));
  const filled = withIdx.filter(x=>String(x.v).trim()!=="")
    .sort((a,b)=> String(a.v).localeCompare(String(b.v), undefined, {sensitivity:'base'}));
  const blank = withIdx.filter(x=>String(x.v).trim()==="");
  return filled.concat(blank);
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

function makeBlankConfig(){
  const cfg = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  cfg.categories = []; // blank slate — no pre-built category slots
  return cfg;
}

function normalizeConfig(cfg){
  if(!cfg.documentSettings) cfg.documentSettings = JSON.parse(JSON.stringify(DEFAULT_CONFIG.documentSettings));
  if(cfg.documentSettings.showMonitoringLine === undefined) cfg.documentSettings.showMonitoringLine = true;
  if(!cfg.titleOptions || !cfg.titleOptions.length){
    cfg.titleOptions = cfg.documentSettings.proposalTitle
      ? [cfg.documentSettings.proposalTitle]
      : JSON.parse(JSON.stringify(DEFAULT_CONFIG.titleOptions));
  }
  if(!cfg.bulletLibrary){
    cfg.bulletLibrary = null; // legacy field, no longer used globally
  }
  (cfg.categories||[]).forEach(cat=>{
    if(!cat.bulletLibrary){
      cat.bulletLibrary = (cfg.bulletLibrary && cfg.bulletLibrary.length)
        ? JSON.parse(JSON.stringify(cfg.bulletLibrary))
        : [];
    }
    if(!cat.priceAddOns) cat.priceAddOns = [];
    if(!cat.bulletLibraryPartsExclude) cat.bulletLibraryPartsExclude = [];
    if(!cat.bulletLibraryProposalExclude) cat.bulletLibraryProposalExclude = [];
    if(!cat.bulletLibraryPrices) cat.bulletLibraryPrices = {};
    if(cat.showInPartsList === undefined) cat.showInPartsList = true;
    if(cat.showAsQuickIcon === undefined) cat.showAsQuickIcon = false;
    if(cat.quickIconEmoji === undefined) cat.quickIconEmoji = "";
    if(cat.counterMode === undefined) cat.counterMode = false;
    if(cat.counterOptionId === undefined) cat.counterOptionId = null;
    (cat.options||[]).forEach(o=>{
      if(!Array.isArray(o.conditions)){
        if(o.condition && o.condition.catId && o.condition.optId){
          o.conditions = [{ catId: o.condition.catId, optId: o.condition.optId }];
        } else {
          o.conditions = [];
        }
        delete o.condition;
      }
    });
  });
  if(!cfg.profitOptions) cfg.profitOptions = JSON.parse(JSON.stringify(DEFAULT_CONFIG.profitOptions));
  if(!cfg.laborRates) cfg.laborRates = JSON.parse(JSON.stringify(DEFAULT_CONFIG.laborRates));
  if(!cfg.noteOptions) cfg.noteOptions = JSON.parse(JSON.stringify(DEFAULT_CONFIG.noteOptions));

  // One-time cleanup: strip the old stock example values if a saved type still has them untouched.
  // Guarded so this only ever runs once per config — otherwise retyping the exact same wording
  // later (e.g. "ALARM INSTALLATION") would get wiped again every time the type is reopened.
  if(!cfg._legacyDefaultsCleaned){
    if(arraysEqual(cfg.titleOptions, LEGACY_STOCK_DEFAULTS.titleOptions)) cfg.titleOptions = [];
    if(arraysEqual(cfg.profitOptions, LEGACY_STOCK_DEFAULTS.profitOptions)) cfg.profitOptions = [];
    if(arraysEqual(cfg.laborRates, LEGACY_STOCK_DEFAULTS.laborRates)) cfg.laborRates = [];
    if(arraysEqual(cfg.noteOptions, LEGACY_STOCK_DEFAULTS.noteOptions)) cfg.noteOptions = [];
    if(cfg.documentSettings.installationLabel === LEGACY_STOCK_DEFAULTS.installationLabel) cfg.documentSettings.installationLabel = "";
    if(cfg.documentSettings.monitoringLabel === LEGACY_STOCK_DEFAULTS.monitoringLabel) cfg.documentSettings.monitoringLabel = "";
    cfg._legacyDefaultsCleaned = true;
  }

  // Migrate noteOptions from plain strings (old format) to {id, text, conditions} objects.
  cfg.noteOptions = (cfg.noteOptions||[]).map(n=>{
    if(typeof n === "string") return { id: uid(), text: n, conditions: [] };
    if(!n.id) n.id = uid();
    if(!Array.isArray(n.conditions)) n.conditions = [];
    return n;
  });

  return cfg;
}

async function loadAllTypes(){
  try{
    const res = await window.storage.get(TYPES_KEY, true);
    if(res && res.value){
      state.proposalTypes = JSON.parse(res.value);
    } else {
      // migrate from the old single-config storage if it exists
      let migrated = null;
      try{
        const legacy = await window.storage.get(LEGACY_CONFIG_KEY, true);
        if(legacy && legacy.value) migrated = JSON.parse(legacy.value);
      }catch(e){ /* no legacy config */ }
      const seedConfig = migrated || makeDefaultAlarmConfig();
      state.proposalTypes = [{ id: uid(), name: "Alarm Installation Proposal", config: seedConfig }];
      await saveAllTypes();
    }
  }catch(e){
    state.proposalTypes = [{ id: uid(), name: "Alarm Installation Proposal", config: makeDefaultAlarmConfig() }];
  }
  state.proposalTypes.forEach(t=> normalizeConfig(t.config));
  state.loaded = true;
  render();
}

async function saveAllTypes(){
  try{
    const r = await window.storage.set(TYPES_KEY, JSON.stringify(state.proposalTypes), true);
    if(!r) showToast("Could not save — try again");
  }catch(e){
    showToast("Save failed: " + (e.message||e));
  }
}

async function nextQuoteNumber(){
  let n = 1001;
  try{
    const res = await window.storage.get(COUNTER_KEY, true);
    if(res && res.value) n = parseInt(res.value,10) + 1;
    await window.storage.set(COUNTER_KEY, String(n), true);
  }catch(e){
    n = 1000 + (Date.now() % 900);
  }
  return n;

function fmtMoney(n){
  return "$" + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

function getSel(catId, optId){
  return (state.selections[catId] && state.selections[catId][optId]) || null;
}
function setSel(catId, optId, patch){
  if(!state.selections[catId]) state.selections[catId] = {};
  const cur = state.selections[catId][optId] || { checked:false, qty:1, bullets:[], bulletAddons:[], printBullets:true };
  state.selections[catId][optId] = Object.assign({}, cur, patch);
}
function clearCategory(catId){
  state.selections[catId] = {};
}

function bulletLines(s){
  return (s && Array.isArray(s.bullets)) ? s.bullets : [];
}
function bulletAddonsFor(s, idx){
  return (s && Array.isArray(s.bulletAddons) && Array.isArray(s.bulletAddons[idx])) ? s.bulletAddons[idx] : [];
}
function adminDefaultShowsOnProposal(cat, text){
  const t = String(text||"").trim().toLowerCase();
  if(!t) return true;
  return !((cat.bulletLibraryProposalExclude||[]).some(x=>x.trim().toLowerCase()===t));
}
function bulletEffectiveShow(cat, s, idx, text){
  const overrides = (s && Array.isArray(s.bulletShowOverride)) ? s.bulletShowOverride : [];
  const ov = overrides[idx];
  if(typeof ov === "boolean") return ov;
  return adminDefaultShowsOnProposal(cat, text);
}
function addonCostForSelection(cat, s){
  let sum = 0;
  const lib = cat.priceAddOns || [];
  (s.bulletAddons||[]).forEach(row=>{
    (row||[]).forEach(a=>{
      const def = lib.find(x=>x.id===a.addonId);
      if(def) sum += Number(def.price||0) * (parseFloat(a.qty)||1);
    });
  });
  return sum;
}

function bulletPhrasePriceSum(cat, s){
  const priceMap = cat.bulletLibraryPrices || {};
  let sum = 0;
  bulletLines(s).forEach(text=>{
    const key = String(text||"").trim().toLowerCase();
    if(key && priceMap[key]) sum += Number(priceMap[key])||0;
  });
  return sum;
}

function renderAddonRows(cat, optId, s, bulletIdx){
  const lib = cat.priceAddOns || [];
  if(!lib.length) return "";
  const addons = bulletAddonsFor(s, bulletIdx);
  let html = "";
  addons.forEach((a, ai)=>{
    html += `
      <div class="addon-row">
        <select class="bullet-addon-select" data-cat="${cat.id}" data-opt="${optId}" data-bidx="${bulletIdx}" data-aidx="${ai}">
          ${lib.map(x=>`<option value="${x.id}" ${a.addonId===x.id?'selected':''}>${escapeAttr(x.label||'(unnamed add-on)')} — ${fmtMoney(x.price||0)}</option>`).join("")}
        </select>
        <input type="number" min="1" class="bullet-addon-qty" data-cat="${cat.id}" data-opt="${optId}" data-bidx="${bulletIdx}" data-aidx="${ai}" value="${a.qty||1}">
        <button type="button" class="bullet-addon-rm" data-cat="${cat.id}" data-opt="${optId}" data-bidx="${bulletIdx}" data-aidx="${ai}">✕</button>
      </div>
    `;
  });
  return html;
}

function renderBulletsEditor(cat, optId, s){
  const collapsed = !!cat.qtyFromBullets && !(s && s.bulletsExpanded);
  if(collapsed){
    return `<button type="button" class="add-opt-btn bullet-add-btn" data-cat="${cat.id}" data-opt="${optId}">+ Add sub-bullet</button>`;
  }
  const lines = bulletLines(s);
  const lib = (cat.bulletLibrary || []).filter(b=>String(b).trim()!=="");
  const libLower = lib.map(b=>b.trim().toLowerCase());
  const hasAddonLib = (cat.priceAddOns||[]).length > 0;
  let html = `<label>Sub-bullets</label>`;
  lines.forEach((text, idx)=>{
    const usedElsewhere = lines.filter((l,i)=> i!==idx).filter(Boolean);
    const availableLib = alphaSort(lib.filter(b => b===text || !usedElsewhere.includes(b)));
    const trimmed = text.trim();
    const isNewPhrase = trimmed !== "" && !libLower.includes(trimmed.toLowerCase());
    const showOnProposal = bulletEffectiveShow(cat, s, idx, text);
    html += `
      <div class="bullet-row">
        <div class="bullet-suggest-wrap">
          <input type="text" class="bullet-line-input" autocomplete="off" data-cat="${cat.id}" data-opt="${optId}" data-idx="${idx}" value="${escapeAttr(text)}" placeholder="Type, or tap to pick from the list">
          <div class="bullet-suggest-list" data-lib='${escapeAttr(JSON.stringify(availableLib))}'></div>
        </div>
        ${hasAddonLib ? `<button type="button" class="bullet-line-add" data-cat="${cat.id}" data-opt="${optId}" data-idx="${idx}" title="Add a priced extra to this sub-bullet">+</button>` : ``}
        <button type="button" class="bullet-line-rm" data-cat="${cat.id}" data-opt="${optId}" data-idx="${idx}">✕</button>
      </div>
      ${trimmed ? `
        <label style="display:flex;align-items:center;gap:5px;margin:-4px 0 8px 2px;font-size:10.5px;color:var(--muted);cursor:pointer;">
          <input type="checkbox" class="bullet-show-checkbox" data-cat="${cat.id}" data-opt="${optId}" data-idx="${idx}" ${showOnProposal?'checked':''}>
          On this proposal (overrides admin default for this quote only)
        </label>
      ` : ``}
      ${renderAddonRows(cat, optId, s, idx)}
      ${isNewPhrase ? `
        <div class="hint" style="margin:-4px 0 8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          Not in this category's library yet.
          <button type="button" class="save-lib-btn" data-cat="${cat.id}" data-opt="${optId}" data-idx="${idx}">+ Add "${escapeAttr(trimmed.length>28?trimmed.slice(0,28)+'…':trimmed)}" to library</button>
        </div>
      ` : ``}
    `;
  });
  html += `<button type="button" class="add-opt-btn bullet-add-btn" data-cat="${cat.id}" data-opt="${optId}">+ Add sub-bullet</button>`;
  return html;
}

function getItemQty(cat, s){
  if(cat.qtyFromBullets) return bulletLines(s).length;
  return parseInt(s.qty,10)||1;
}

function effectivePrintBullets(cat, s){
  return cat.qtyFromBullets ? (s.printBullets === true) : (s.printBullets !== false);
}

function renderScopeDetailHtml(cat, optId, s){
  return `
    <div class="scope-detail">
      ${cat.qtyFromBullets ? `
      <div class="qty-wrap">
        <label>Qty (auto)</label>
        <input type="number" value="${bulletLines(s).length}" disabled style="background:#f4f2ec;color:var(--muted);">
      </div>
      ` : ``}
      <div class="bullets-wrap">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" data-print-cat="${cat.id}" data-print-opt="${optId}" ${effectivePrintBullets(cat,s)?'checked':''}>
          Print sub-bullets on proposal
        </label>
        ${renderBulletsEditor(cat, optId, s)}
        ${effectivePrintBullets(cat,s) ? `
        <select data-style-cat="${cat.id}" data-style-opt="${optId}" style="margin-top:6px;font-size:12px;padding:6px 8px;">
          <option value="list" ${(!s.bulletStyle||s.bulletStyle==='list')?'selected':''}>Always a bulleted list</option>
          <option value="inline" ${s.bulletStyle==='inline'?'selected':''}>Always one line, lettered (A) (B)…</option>
        </select>
        ` : (cat.qtyFromBullets && s.bulletsExpanded ? `<div class="hint" style="margin-top:6px;">These bullets are just used to count quantity and won't print.</div>` : ``)}
      </div>
    </div>
  `;
}

function countSelectedInCategory(cat){
  const sel = state.selections[cat.id] || {};
  let total = 0;
  (cat.options||[]).forEach(o=>{
    const s = sel[o.id];
    if(s && s.checked){
      total += getItemQty(cat, s);
    }
  });
  return total;
}

function quickCounterValue(cat){
  if(!cat.counterOptionId) return 0;
  const s = getSel(cat.id, cat.counterOptionId);
  if(!s || !s.checked) return 0;
  return getItemQty(cat, s);
}

function quickCounterIncrement(catId){
  const cat = state.config.categories.find(c=>c.id===catId);
  if(!cat || !cat.counterOptionId) return;
  const opt = cat.options.find(o=>o.id===cat.counterOptionId);
  if(!opt) return;
  const s = getSel(catId, cat.counterOptionId) || {};
  if(cat.qtyFromBullets){
    const lines = bulletLines(s).slice();
    lines.push("");
    const addonsArr = (Array.isArray(s.bulletAddons) ? s.bulletAddons.slice() : []);
    addonsArr.push([]);
    const overrideArr = (Array.isArray(s.bulletShowOverride) ? s.bulletShowOverride.slice() : []);
    overrideArr.push(null);
    setSel(catId, cat.counterOptionId, {
      checked: true, bullets: lines, bulletAddons: addonsArr, bulletShowOverride: overrideArr,
      bulletsExpanded: true, bulletStyle: s.bulletStyle || opt.bulletStyle || "list"
    });
  } else {
    const curQty = s.checked ? (parseInt(s.qty,10)||1) : 0;
    const initialBullets = s.checked ? (s.bullets||[]) : (opt.bullets||[]).slice();
    setSel(catId, cat.counterOptionId, {
      checked: true, qty: curQty + 1, bullets: initialBullets,
      bulletsExpanded: s.bulletsExpanded || false, bulletStyle: s.bulletStyle || opt.bulletStyle || "list"
    });
  }
  reconcileConditionalSelections();
  applyAutoNotes();
}

function quickCounterDecrement(catId){
  const cat = state.config.categories.find(c=>c.id===catId);
  if(!cat || !cat.counterOptionId) return;
  const s = getSel(catId, cat.counterOptionId);
  if(!s || !s.checked) return; // already at zero, nothing to do
  if(cat.qtyFromBullets){
    const lines = bulletLines(s).slice();
    if(lines.length <= 1){
      setSel(catId, cat.counterOptionId, { checked:false, bullets:[], bulletAddons:[], bulletShowOverride:[] });
    } else {
      lines.pop();
      const addonsArr = (Array.isArray(s.bulletAddons) ? s.bulletAddons.slice(0, lines.length) : []);
      const overrideArr = (Array.isArray(s.bulletShowOverride) ? s.bulletShowOverride.slice(0, lines.length) : []);
      setSel(catId, cat.counterOptionId, { bullets: lines, bulletAddons: addonsArr, bulletShowOverride: overrideArr });
    }
  } else {
    const curQty = parseInt(s.qty,10)||1;
    if(curQty <= 1){
      setSel(catId, cat.counterOptionId, { checked:false });
    } else {
      setSel(catId, cat.counterOptionId, { qty: curQty - 1 });
    }
  }
  reconcileConditionalSelections();
}

function optionConditionMet(o){
  const conds = (o.conditions||[]).filter(c=>c && c.catId && c.optId);
  if(conds.length === 0) return true; // no conditions set — always visible
  return conds.some(c=>{
    const sel = state.selections[c.catId];
    return !!(sel && sel[c.optId] && sel[c.optId].checked);
  });
}

function reconcileConditionalSelections(){
  // If a selected option's trigger condition is no longer met, clear it so
  // hidden/invalid selections don't silently stay counted or printed.
  (state.config.categories||[]).forEach(cat=>{
    (cat.options||[]).forEach(o=>{
      if((o.conditions||[]).some(c=>c && c.catId && c.optId)){
        const sel = state.selections[cat.id] && state.selections[cat.id][o.id];
        if(sel && sel.checked && !optionConditionMet(o)){
          setSel(cat.id, o.id, { checked: false });
        }
      }
    });
  });
}

function noteConditionsMet(conditions){
  const conds = (conditions||[]).filter(c=>c && c.catId && c.optId);
  if(conds.length === 0) return false; // no conditions = suggestion only, never auto-added
  return conds.some(c=>{
    const sel = state.selections[c.catId];
    return !!(sel && sel[c.optId] && sel[c.optId].checked);
  });
}

function applyAutoNotes(){
  // Auto-add notes whose conditions are met, unless the rep already removed
  // that same auto-added note from this proposal (tracked by dismissedAutoNoteIds).
  (state.config.noteOptions||[]).forEach(no=>{
    if(!noteConditionsMet(no.conditions)) return;
    if(state.dismissedAutoNoteIds.includes(no.id)) return;
    const alreadyPresent = state.notes.some(n=>n.sourceId===no.id);
    if(alreadyPresent) return;
    state.notes.push({ text: no.text, red: true, sourceId: no.id });
  });
}

function computeDefaultTotals(){
  let installation = 0, monthly = 0;
  (state.config.categories||[]).forEach(cat=>{
    const sel = state.selections[cat.id] || {};
    (cat.options||[]).forEach(o=>{
      const s = sel[o.id];
      if(s && s.checked){
        const qty = getItemQty(cat, s);
        const amt = Number(o.price||0) * qty + addonCostForSelection(cat, s) + bulletPhrasePriceSum(cat, s);
        if(cat.rollup === "installation") installation += amt;
        else if(cat.rollup === "monthly") monthly += amt;
      }
    });
  });
  return { installation, monthly };
}

function computeScopeItems(){
  const items = [];
  (state.config.categories||[]).forEach(cat=>{
    if(!cat.showInList) return;
    const sel = state.selections[cat.id] || {};
    (cat.options||[]).forEach(o=>{
      const s = sel[o.id];
      if(s && s.checked){
        const qty = getItemQty(cat, s);
        const bullets = effectivePrintBullets(cat, s) ? (Array.isArray(s.bullets) ? s.bullets : [])
          .map((text, bi)=>({ text: String(text||"").trim(), idx: bi }))
          .filter(b => b.text && bulletEffectiveShow(cat, s, b.idx, b.text))
          .map(b => b.text)
          : [];
        const bulletStyle = s.bulletStyle || "list";
        items.push({ label:o.label, qty, bullets, bulletStyle });
      }
    });
  });
  return items;
}

function computePartsListGroups(){
  // Internal-use data: every category (not just ones shown on the proposal),
  // every sub-bullet regardless of the print toggle (except ones marked "hide from parts list"
  // in that category's bullet library), and full price add-on detail.
  const groups = [];
  (state.config.categories||[]).forEach(cat=>{
    if(cat.showInPartsList === false) return;
    const excludeSet = (cat.bulletLibraryPartsExclude||[]).map(x=>x.trim().toLowerCase());
    const sel = state.selections[cat.id] || {};
    const catItems = [];
    (cat.options||[]).forEach(o=>{
      const s = sel[o.id];
      if(s && s.checked){
        const qty = getItemQty(cat, s);
        const bullets = bulletLines(s).map((text, bi)=>{
          const t = String(text||"").trim();
          if(t && excludeSet.includes(t.toLowerCase())) return null; // admin hid this phrase from the parts list
          const addons = bulletAddonsFor(s, bi).map(a=>{
            const def = (cat.priceAddOns||[]).find(x=>x.id===a.addonId);
            if(!def) return null;
            const aq = parseInt(a.qty,10)||1;
            return { label: def.label || "(unnamed add-on)", qty: aq, price: (def.price||0)*aq };
          }).filter(Boolean);
          return { text: t, addons };
        }).filter(b => b && (b.text || b.addons.length));
        catItems.push({ label:o.label, qty, price:(o.price||0)*qty, bullets });
      }
    });
    if(catItems.length) groups.push({ categoryName: cat.name, items: catItems });
  });
  return groups;
}

function letterFor(i){
  let s = "";
  i = i;
  do{
    s = String.fromCharCode(65 + (i % 26)) + s;
    i = Math.floor(i/26) - 1;
  }while(i >= 0);
  return s;
}

          <button class="btn-primary type-open-btn" data-type="${t.id}" style="flex:1;padding:10px;font-size:13.5px;">Open</button>
          <button class="btn-ghost type-dup-btn" data-type="${t.id}" style="flex:none;padding:10px 12px;font-size:13px;">Duplicate</button>
          <button class="btn-danger-ghost type-del-btn" data-type="${t.id}">${state.pendingDeleteType===t.id ? 'Confirm?' : 'Delete'}</button>
        </div>
      </div>
    `;
  });

  if(state.creatingType){
    html += `
      <div class="card" style="margin-top:14px;">
        <div class="field"><label>New proposal type name</label>
          <input type="text" id="newTypeNameInp" value="${escapeAttr(state.newTypeName)}" placeholder="e.g. Camera System Proposal"></div>
        <div class="field"><label>Start from</label>
          <select id="newTypeSourceSel">
            <option value="blank" ${state.newTypeSource==='blank'?'selected':''}>Blank (no categories yet)</option>
            ${state.proposalTypes.map(t=>`<option value="${t.id}" ${state.newTypeSource===t.id?'selected':''}>Duplicate "${escapeAttr(t.name)}"</option>`).join("")}
          </select>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button class="btn btn-primary" id="confirmCreateTypeBtn" style="flex:1;width:auto;">Create</button>
          <button class="btn btn-ghost" id="cancelCreateTypeBtn" style="flex:none;width:auto;padding:14px 18px;">Cancel</button>
        </div>
      </div>
    `;
  } else {
    html += `<button class="add-cat-btn" id="startCreateTypeBtn" style="margin-top:14px;">+ Create New Proposal Type</button>`;
  }

  if(!IS_CLAUDE_STORAGE){
    const { apiBase } = getSyncSettings();
    html += `
      <div class="hint" style="margin-top:18px;text-align:center;">
        ${apiBase ? `Syncing with ${escapeAttr(apiBase)}` : `Not syncing — saving to this device only`}
        &nbsp;·&nbsp; <a href="#" id="openSyncSettingsLink" style="color:var(--blue);">Sync settings</a>
      </div>
    `;
  }

  html += `
    <h2 class="section-title" style="margin-top:26px;">Backup &amp; Migration</h2>
    <div class="hint">Export everything below to a file you can save, then import it anywhere else this app is running (e.g. moving from here into a Railway deployment) — nothing transfers automatically between them otherwise.</div>
    <div class="card">
      <button class="btn-ghost" id="exportTypesBtn" style="width:100%;padding:12px;font-size:14px;font-weight:700;border-radius:9px;cursor:pointer;">Export all proposal types</button>
      <button class="btn-ghost" id="importTypesBtn" style="width:100%;padding:12px;font-size:14px;font-weight:700;border-radius:9px;cursor:pointer;margin-top:8px;">Import proposal types</button>
      <input type="file" id="importTypesFile" accept="application/json,.json" style="display:none;">
      <div class="hint" style="margin-top:8px;">Import adds the file's proposal types alongside whatever's already here — it won't overwrite or delete anything existing.</div>
    </div>
  `;

  main.innerHTML = html;
  wireLanding(main);
  const syncLink = main.querySelector("#openSyncSettingsLink");
  if(syncLink) syncLink.onclick = (e)=>{ e.preventDefault(); state.view = "syncSetup"; state.syncSetupReturnTo = "landing"; render(); };

  const exportBtn = main.querySelector("#exportTypesBtn");
  if(exportBtn) exportBtn.onclick = ()=>{
    try{
      const payload = JSON.stringify({ exportedAt: new Date().toISOString(), proposalTypes: state.proposalTypes }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `proposal-types-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      showToast("Exported " + state.proposalTypes.length + " proposal type(s)");
    }catch(e){
      showToast("Export failed: " + (e.message||e));
    }
  };

  const importBtn = main.querySelector("#importTypesBtn");
  const importFileInp = main.querySelector("#importTypesFile");
  if(importBtn && importFileInp){
    importBtn.onclick = ()=> importFileInp.click();
    importFileInp.onchange = (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          const incoming = Array.isArray(parsed) ? parsed : parsed.proposalTypes;
          if(!Array.isArray(incoming)) throw new Error("File doesn't look like a proposal types backup");
          let count = 0;
          incoming.forEach(t=>{
            if(!t || !t.config) return;
            const config = JSON.parse(JSON.stringify(t.config));
            normalizeConfig(config);
            state.proposalTypes.push({ id: uid(), name: (t.name||"Imported Proposal Type"), config });
            count++;
          });
          saveAllTypes();
          showToast(`Imported ${count} proposal type(s)`);
          render();
        }catch(err){
          showToast("Import failed: " + (err.message||err));
        }
        importFileInp.value = "";
      };
      reader.readAsText(file);
    };
  }
}

function renderSyncSetup(main){
  const { apiBase, apiKey } = getSyncSettings();
  main.innerHTML = `
    <h2 class="section-title">Sync Settings</h2>
    <div class="hint">This device isn't running inside Claude, so it needs a sync backend to share proposal types with your other devices. Everything still works fully offline on this device either way — this just keeps devices in sync when there's a connection. Leave this blank to use this device only.</div>
    <div class="card">
      <div class="field"><label>API Base URL</label>
        <input type="text" id="syncApiBase" value="${escapeAttr(apiBase)}" placeholder="https://your-app.up.railway.app"></div>
      <div class="field"><label>API Key</label>
        <input type="text" id="syncApiKey" value="${escapeAttr(apiKey)}" placeholder="Paste the SYNC_API_KEY from Railway"></div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn btn-primary" id="saveSyncSettingsBtn" style="flex:1;width:auto;">Save &amp; Continue</button>
        <button class="btn btn-ghost" id="skipSyncSettingsBtn" style="flex:none;width:auto;padding:14px 18px;">Use this device only</button>
      </div>
    </div>
  `;
  main.querySelector("#saveSyncSettingsBtn").onclick = ()=>{
    const base = main.querySelector("#syncApiBase").value.trim().replace(/\/$/,"");
    const key = main.querySelector("#syncApiKey").value.trim();
    try{
      localStorage.setItem("SYNC_API_BASE", base);
      localStorage.setItem("SYNC_API_KEY", key);
      localStorage.setItem("SYNC_SETUP_DONE", "1");
    }catch(e){}
    proceedPastSyncSetup();
  };
  main.querySelector("#skipSyncSettingsBtn").onclick = ()=>{
    try{
      localStorage.setItem("SYNC_API_BASE", "");
      localStorage.setItem("SYNC_SETUP_DONE", "1");
    }catch(e){}
    proceedPastSyncSetup();
  };
}

function proceedPastSyncSetup(){
  state.view = "landing";
  state.loaded = false;
  loadAllTypes();
}

function wireLanding(main){
  main.querySelectorAll(".type-name-input").forEach(inp=>{
    inp.onchange = ()=>{
      const t = state.proposalTypes.find(x=>x.id===inp.dataset.type);
      if(t){ t.name = inp.value || "Untitled Proposal Type"; saveAllTypes(); }
    };
  });
  main.querySelectorAll(".type-open-btn").forEach(btn=>{
    btn.onclick = ()=> selectProposalType(btn.dataset.type);
  });
  main.querySelectorAll(".type-card-top .type-name-input").forEach(inp=>{
    inp.onclick = (e)=> e.stopPropagation();
  });
  main.querySelectorAll(".type-dup-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const t = state.proposalTypes.find(x=>x.id===btn.dataset.type);
      if(!t) return;
      const clone = JSON.parse(JSON.stringify(t.config));
      state.proposalTypes.push({ id: uid(), name: t.name + " (Copy)", config: clone });
      saveAllTypes();
      render();
    };
  });
  main.querySelectorAll(".type-del-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.type;
      if(state.pendingDeleteType === id){
        state.proposalTypes = state.proposalTypes.filter(x=>x.id!==id);
        state.pendingDeleteType = null;
        saveAllTypes(); render();
      } else {
        state.pendingDeleteType = id;
        render();
        setTimeout(()=>{
          if(state.pendingDeleteType === id){ state.pendingDeleteType = null; render(); }
        }, 3000);
      }
    };
  });
  const startBtn = main.querySelector("#startCreateTypeBtn");
  if(startBtn) startBtn.onclick = ()=>{ state.creatingType = true; state.newTypeName = ""; state.newTypeSource = "blank"; render(); };
  const cancelBtn = main.querySelector("#cancelCreateTypeBtn");
  if(cancelBtn) cancelBtn.onclick = ()=>{ state.creatingType = false; render(); };
  const nameInp = main.querySelector("#newTypeNameInp");
  if(nameInp) nameInp.oninput = e=> state.newTypeName = e.target.value;
  const sourceSel = main.querySelector("#newTypeSourceSel");
  if(sourceSel) sourceSel.onchange = e=> state.newTypeSource = e.target.value;
  const confirmBtn = main.querySelector("#confirmCreateTypeBtn");
  if(confirmBtn) confirmBtn.onclick = ()=>{
    const name = (state.newTypeName||"").trim() || "New Proposal Type";
    let config;
    if(state.newTypeSource === "blank"){
      config = makeBlankConfig();
    } else {
      const src = state.proposalTypes.find(t=>t.id===state.newTypeSource);
      config = src ? JSON.parse(JSON.stringify(src.config)) : makeBlankConfig();
    }
    normalizeConfig(config);
    const newType = { id: uid(), name, config };
    state.proposalTypes.push(newType);
    state.creatingType = false;
    saveAllTypes();
    selectProposalType(newType.id);
  };
}

              <button class="rm" data-action="del-opt" data-cat="${cat.id}" data-opt="${o.id}">✕</button>

            <div class="bullets-label">Only show this option when (any one match is enough)</div>
            ${(o.conditions||[]).length===0 ? `<div class="hint" style="margin-top:-2px;">Always shown — no conditions set.</div>` : ``}
            ${(o.conditions||[]).map((cond, ci)=>`
              <div class="row2" style="margin-bottom:8px;">
                <select class="opt-cond-cat" data-cat="${cat.id}" data-opt="${o.id}" data-idx="${ci}">
                  <option value="">— Choose category —</option>
                  ${state.config.categories.filter(c2=>c2.id!==cat.id).map(c2=>`<option value="${c2.id}" ${cond.catId===c2.id?'selected':''}>${escapeAttr(c2.name||'Untitled Category')}</option>`).join("")}
                </select>
                <div style="display:flex;gap:6px;">
                  <select class="opt-cond-opt" data-cat="${cat.id}" data-opt="${o.id}" data-idx="${ci}" ${!cond.catId?'disabled':''} style="flex:1;">
                    <option value="">— Choose option —</option>
                    ${(()=>{
                      const condCat = cond.catId ? state.config.categories.find(c2=>c2.id===cond.catId) : null;
                      if(!condCat) return "";
                      return (condCat.options||[]).map(co=>`<option value="${co.id}" ${cond.optId===co.id?'selected':''}>${escapeAttr(co.label)}</option>`).join("");
                    })()}
                  </select>
                  <button class="rm" data-action="del-condition" data-cat="${cat.id}" data-opt="${o.id}" data-idx="${ci}">✕</button>
                </div>
              </div>
            `).join("")}
            <button class="add-opt-btn" data-action="add-condition" data-cat="${cat.id}" data-opt="${o.id}" style="margin-bottom:10px;">+ Add condition</button>
            <div class="bullets-label">Default sub-bullets (one per line, optional)</div>
            <textarea class="opt-bullets" placeholder="e.g. App Access&#10;Arm / Disarm Remotely">${escapeAttr((o.bullets||[]).join("\n"))}</textarea>
            ${alphaSort((cat.bulletLibrary||[]).filter(b=>String(b).trim()!=="")).length ? `
              <div class="quick-add-row">
                <select class="lib-select" data-cat="${cat.id}" data-opt="${o.id}">
                  ${alphaSort((cat.bulletLibrary||[]).filter(b=>String(b).trim()!=="")).map(b=>`<option value="${escapeAttr(b)}">${escapeAttr(b)}</option>`).join("")}
                </select>
                <button type="button" data-action="quick-add-bullet" data-cat="${cat.id}" data-opt="${o.id}">+ Add to bullets</button>
              </div>
            ` : ``}
            <div class="bullets-label" style="margin-top:8px;">Bullet display on quote</div>
            <select class="opt-bulletstyle">
              <option value="list" ${(!o.bulletStyle||o.bulletStyle==='list')?'selected':''}>Always a bulleted list</option>
              <option value="inline" ${o.bulletStyle==='inline'?'selected':''}>Always one line, lettered (A) (B)…</option>
            </select>
          </div>
        `).join("")}
        <button class="add-opt-btn" data-action="add-opt" data-cat="${cat.id}">+ Add option</button>
      </div>
    </div>
  `;
}

function getAdminSections(){
  const cats = state.config.categories||[];
  return [
    { id: "doc", label: "Document Settings" },
    { id: "profit", label: "Profit Margin Options" },
    { id: "labor", label: "Labor Rate Options" },
    { id: "notes", label: "Customer Note Options" },
    ...cats.map(c=>({ id: "cat:"+c.id, label: c.name || "Untitled Category" }))
  ];
}

function renderAdmin(main){
  const ds = state.config.documentSettings;
  const cats = state.config.categories||[];
  const sections = getAdminSections();

  if(state.adminSectionIndex >= sections.length) state.adminSectionIndex = sections.length-1;
  if(state.adminSectionIndex < 0) state.adminSectionIndex = 0;
  const idx = state.adminSectionIndex;
  const current = sections[idx];

  let body = "";
  if(current.id === "doc") body = renderDocSettingsSection(ds);
  else if(current.id === "profit") body = renderProfitSection();
  else if(current.id === "labor") body = renderLaborSection();
  else if(current.id === "notes") body = renderNotesSection();
  else if(current.id.startsWith("cat:")){
    const catId = current.id.slice(4);
    const catIdx = cats.findIndex(c=>c.id===catId);
    if(catIdx >= 0) body = renderCategorySection(cats[catIdx], catIdx, cats.length);
  }

  const html = `
    <div class="admin-nav">
      <button type="button" id="adminPrevBtn" ${idx===0?'disabled':''}>◀</button>
      <div class="admin-nav-label">
        <span class="idx">${idx+1} of ${sections.length}</span>
        ${escapeAttr(current.label)}
      </div>
      <button type="button" id="adminNextBtn" ${idx===sections.length-1?'disabled':''}>▶</button>
    </div>
    ${body}
    <button class="add-cat-btn" data-action="add-cat">+ Add category</button>
  `;
  main.innerHTML = html;
  wireAdmin(main);

  const prevBtn = main.querySelector("#adminPrevBtn");
  if(prevBtn) prevBtn.onclick = ()=>{ state.adminSectionIndex = Math.max(0, idx-1); render(); };
  const nextBtn = main.querySelector("#adminNextBtn");
  if(nextBtn) nextBtn.onclick = ()=>{ state.adminSectionIndex = Math.min(sections.length-1, idx+1); render(); };
}

  const addCatBtn = main.querySelector('[data-action="add-cat"]');
  if(addCatBtn) addCatBtn.onclick = ()=>{
    state.config.categories.push({id:uid(), name:"New Category", type:"single", showInList:false, rollup:"none", bulletLibrary:[], priceAddOns:[], bulletLibraryPartsExclude:[], bulletLibraryProposalExclude:[], bulletLibraryPrices:{}, showInPartsList:true, options:[]});
    saveConfig();
    state.adminSectionIndex = getAdminSections().length - 1; // jump to the new category
    render();
  };
}

function escapeAttr(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

/* ---------- QUOTE VIEW ---------- */

function renderQuote(main){
  const cats = state.config.categories||[];
  const defaults = computeDefaultTotals();
  const markup = 1 + (parseFloat(state.profitPercent)||0)/100;
  const laborTotal = (parseFloat(state.laborRate)||0) * (parseFloat(state.laborTechs)||0) * (parseFloat(state.laborHours)||0);
  if(!state.installDirty) state.installTotal = (defaults.installation * markup + laborTotal).toFixed(2);
  if(!state.monitorDirty) state.monitorTotal = defaults.monthly.toFixed(2);

  const titleOptions = state.config.titleOptions||[];

  let html = `
    <h2 class="section-title">Customer Information</h2>
    <div class="card">
      <div class="field"><label>Customer name</label>
        <input type="text" id="c_name" value="${escapeAttr(state.customer.name)}" placeholder="Customer full name"></div>
      <div class="field"><label>Business name (optional)</label>
        <input type="text" id="c_business" value="${escapeAttr(state.customer.business)}" placeholder="Leaves this line off the quote if blank"></div>
      <div class="field"><label>Service address</label>
        <input type="text" id="c_address" value="${escapeAttr(state.customer.address)}" placeholder="Street address, City, State"></div>
      <div class="row2">
        <div class="field"><label>Phone number</label>
          <input type="tel" id="c_phone" value="${escapeAttr(state.customer.phone)}" placeholder="(555) 555-0123"></div>
        <div class="field"><label>Email</label>
          <input type="email" id="c_email" value="${escapeAttr(state.customer.email)}" placeholder="name@email.com"></div>
      </div>
      <div class="field"><label>Proposal date</label>
        <input type="date" id="c_date" value="${escapeAttr(state.proposalDate)}"></div>
    </div>

    <h2 class="section-title">Proposal Title</h2>
    <div class="card">
      <select id="p_title_select">
        ${titleOptions.map(t=>`<option value="${escapeAttr(t)}" ${state.titleChoice===t?'selected':''}>${escapeAttr(t)}</option>`).join("")}
        <option value="__custom__" ${state.titleChoice==='__custom__'?'selected':''}>Custom title…</option>
      </select>
      ${state.titleChoice==='__custom__' ? `
        <div class="field" style="margin-top:10px;">
          <input type="text" id="p_title_custom" value="${escapeAttr(state.customTitle)}" placeholder="Type a custom proposal title">
        </div>
      ` : ``}
    </div>
  `;

  cats.forEach(cat=>{
    html += `<h2 class="section-title">${escapeAttr(cat.name)}</h2><div class="card">`;
    if(!cat.options || cat.options.length===0){
      html += `<div class="empty">No options in this category yet.</div>`;
    } else if(cat.type === "multi"){
      const visibleOpts = cat.options.filter(optionConditionMet);
      const hiddenCount = cat.options.length - visibleOpts.length;
      if(hiddenCount > 0){
        html += `<div class="hint" style="margin-bottom:6px;">${hiddenCount} option${hiddenCount===1?'':'s'} hidden until its related selection is made elsewhere.</div>`;
      }
      visibleOpts.forEach(o=>{
        const s = getSel(cat.id, o.id);
        const checked = !!(s && s.checked);
        html += `
          <div class="scope-row">
            <label class="scope-main" style="cursor:pointer;">
              <input type="checkbox" data-multi-cat="${cat.id}" data-opt="${o.id}" ${checked?'checked':''}>
              <span class="opt-label">${escapeAttr(o.label)}</span>
              <span class="opt-price">${o.price? fmtMoney(o.price):''}</span>
            </label>
            ${checked ? renderScopeDetailHtml(cat, o.id, s) : ``}
          </div>
        `;
      });
    } else {
      const curSel = Object.keys(state.selections[cat.id]||{}).find(k=>state.selections[cat.id][k].checked);
      const s = curSel ? getSel(cat.id, curSel) : null;
      const visibleOpts = cat.options.filter(optionConditionMet);
      const hiddenCount = cat.options.length - visibleOpts.length;
      html += `<select data-single-cat="${cat.id}">
        <option value="">— Select —</option>
        ${visibleOpts.map(o=>`<option value="${o.id}" ${curSel===o.id?'selected':''}>${escapeAttr(o.label)}${o.price? ' — '+fmtMoney(o.price):''}</option>`).join("")}
      </select>
      ${hiddenCount>0 ? `<div class="hint" style="margin-top:4px;">${hiddenCount} option${hiddenCount===1?'':'s'} hidden until its related selection is made elsewhere.</div>` : ``}
      ${(curSel && cat.showInList) ? renderScopeDetailHtml(cat, curSel, s) : ``}`;
    }
    html += `</div>`;
  });

  html += `
    <h2 class="section-title">Customer Notes</h2>
    <div class="card">
      ${state.notes.length === 0 ? `<div class="hint" style="margin-top:0;">No notes added yet.</div>` : ``}
      ${state.notes.map((n,ni)=>{
        const noteOpts = alphaSort((state.config.noteOptions||[]).map(o=>o.text).filter(x=>x.trim()!==""));
        return `
        <div class="bullet-row" style="margin-bottom:6px;">
          <div class="bullet-suggest-wrap">
            <input type="text" class="note-line-input" autocomplete="off" data-idx="${ni}" value="${escapeAttr(n.text)}" placeholder="Type, or tap to pick a pre-written note">
            <div class="bullet-suggest-list" data-lib='${escapeAttr(JSON.stringify(noteOpts))}'></div>
          </div>
          <button type="button" class="note-line-rm" data-idx="${ni}">✕</button>
        </div>
        <label style="display:flex;align-items:center;gap:6px;margin:-2px 0 10px 2px;font-size:11.5px;color:var(--muted);cursor:pointer;">
          <input type="checkbox" class="note-line-red" data-idx="${ni}" ${n.red?'checked':''}>
          Print this note in red so it stands out
        </label>
        `;
      }).join("")}

    <h2 class="section-title">Pricing</h2>
    <div class="card">
      <div class="field">
        <label>Profit margin</label>

          <option value="0" ${state.profitPercent==='0'?'selected':''}>No markup (0%)</option>
          ${(state.config.profitOptions||[]).map(p=>`<option value="${p}" ${String(p)===String(state.profitPercent)?'selected':''}>${p}%</option>`).join("")}
        </select>
        <div class="hint" style="margin-top:6px;">Adds this percentage on top of the installation total below.</div>

      <div class="field">
        <label>Labor</label>

          <option value="0" ${state.laborRate==='0'?'selected':''}>No labor added</option>
          ${(state.config.laborRates||[]).map(r=>`<option value="${r}" ${String(r)===String(state.laborRate)?'selected':''}>${fmtMoney(r)}/hr</option>`).join("")}
        </select>
        <div class="row2" style="margin-top:8px;">
          <div class="field"><label style="font-size:11px;">Number of techs</label>
            <input type="number" min="0" step="1" id="labor_techs" value="${state.laborTechs}"></div>
          <div class="field"><label style="font-size:11px;">Estimated hours</label>
            <input type="number" min="0" step="0.5" id="labor_hours" value="${state.laborHours}"></div>
        </div>
        <div class="hint" style="margin-top:2px;">${fmtMoney(parseFloat(state.laborRate)||0)}/hr × ${state.laborTechs||0} techs × ${state.laborHours||0} hrs = ${fmtMoney(laborTotal)} (added to installation total)</div>
      </div>
      <div class="summary-line"><span class="l">${escapeAttr(state.config.documentSettings.installationLabel)}</span>
        <input type="number" step="0.01" id="install_total" value="${state.installTotal}"></div>
      ${state.config.documentSettings.showMonitoringLine!==false ? `
      <div class="summary-line"><span class="l">${escapeAttr(state.config.documentSettings.monitoringLabel)}</span>
        <input type="number" step="0.01" id="monitor_total" value="${state.monitorTotal}"></div>
      ` : ``}
      <div class="hint">Auto-filled from your selections above — edit either field to quote a different price.</div>
    </div>

    <h2 class="section-title">Closing &amp; Signature</h2>
    <div class="card">
      <div class="field"><label>Closing paragraph</label>
        <textarea id="closing_text" rows="3">${escapeAttr(state.closingText)}</textarea>
      </div>
      <div class="row2">
        <div class="field"><label>Sales rep name</label><input type="text" id="rep_name" value="${escapeAttr(state.rep)}" placeholder="Sales rep name"></div>
        <div class="field"><label>Rep title</label><input type="text" id="rep_title" value="${escapeAttr(state.repTitle)}" placeholder="e.g. Sales Representative"></div>
      </div>
    </div>
  `;

  main.innerHTML = html;

  const footer = document.createElement("div");
  footer.className = "footer-bar";
  footer.innerHTML = `
    <button class="btn btn-primary" id="genPdfBtn" ${state.generating?'disabled':''}>${state.generating? 'Generating PDF…' : 'Generate Proposal PDF'}</button>
    <button class="btn btn-ghost" id="genPartsBtn" style="margin-top:8px;" ${state.generatingParts?'disabled':''}>${state.generatingParts? 'Generating…' : 'Generate Parts List (Internal)'}</button>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-ghost" id="exportDraftBtn" style="flex:1;width:auto;font-size:13px;padding:11px;">Save Draft</button>
      <button class="btn btn-ghost" id="importDraftBtn" style="flex:1;width:auto;font-size:13px;padding:11px;">Load Draft</button>
      <input type="file" id="importDraftFile" accept="application/json,.json" style="display:none;">

  `;
  main.appendChild(footer);

  // Quick-icon dock (floating in the left margin) + quick-picker modal
  const quickCats = (state.config.categories||[]).filter(c=>c.showAsQuickIcon);
  if(quickCats.length){
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.id = "quickDockToggleBtn";
    toggle.className = "quick-dock-toggle";
    toggle.title = state.quickDockCollapsed ? "Show quick icons" : "Hide quick icons";
    toggle.textContent = state.quickDockCollapsed ? "▶" : "◀";
    main.appendChild(toggle);

    if(!state.quickDockCollapsed){
      const dock = document.createElement("div");
      dock.className = "quick-icon-dock";
      dock.innerHTML = quickCats.map(c=>{
        const glyph = (c.quickIconEmoji && c.quickIconEmoji.trim()) ? c.quickIconEmoji.trim() : (c.name||"?").trim().slice(0,6).toUpperCase();
        if(c.counterMode && c.counterOptionId){
          const val = quickCounterValue(c);
          return `
            <div class="quick-counter-row" title="${escapeAttr(c.name)}">

        const count = countSelectedInCategory(c);
        return `
          <button type="button" class="quick-icon-btn" data-quick-cat="${c.id}" title="${escapeAttr(c.name)}">
            ${escapeAttr(glyph)}

      main.appendChild(dock);
    }
  }

  if(state.quickIconCatId){
    const qCat = quickCats.find(c=>c.id===state.quickIconCatId);
    if(qCat){
      const sel = state.selections[qCat.id] || {};
      const visibleOpts = (qCat.options||[]).filter(optionConditionMet);
      const modal = document.createElement("div");
      modal.className = "quick-modal-backdrop";
      modal.id = "quickModalBackdrop";
      modal.innerHTML = `
        <div class="quick-modal-sheet">
          <div class="quick-modal-header">
            <div class="quick-modal-title">${escapeAttr(qCat.name)}</div>
            <button type="button" class="quick-modal-close" id="quickModalCloseBtn">Done</button>
          </div>
          ${visibleOpts.length===0 ? `<div class="quick-modal-empty">No options available right now.</div>` : visibleOpts.map(o=>{
            const checked = qCat.type==="multi" ? !!(sel[o.id]&&sel[o.id].checked) : (Object.keys(sel).find(k=>sel[k].checked)===o.id);
            const optS = checked ? getSel(qCat.id, o.id) : null;
            return `
              <div class="scope-row">
                <label class="quick-modal-opt scope-main">
                  <input type="${qCat.type==='multi'?'checkbox':'radio'}" name="quickpick_${qCat.id}" class="quick-pick-input" data-quick-cat="${qCat.id}" data-quick-opt="${o.id}" ${checked?'checked':''}>
                  <span class="opt-label">${escapeAttr(o.label)}</span>
                  <span class="opt-price">${o.price?fmtMoney(o.price):''}</span>
                </label>
                ${checked && optS ? renderScopeDetailHtml(qCat, o.id, optS) : ``}
              </div>
            `;
          }).join("")}
        </div>
      `;
      main.appendChild(modal);
    }
  }

  wireQuote(main);
}

function wireSuggestInput(inp, main, onCommit){
  const wrap = inp.closest(".bullet-suggest-wrap");
  const listEl = wrap ? wrap.querySelector(".bullet-suggest-list") : null;
  let lib = [];
  if(listEl){
    try{ lib = JSON.parse(listEl.getAttribute("data-lib") || "[]"); }catch(e){ lib = []; }
  }
  function showSuggestions(){
    if(!listEl || !lib.length) return;
    const q = inp.value.trim().toLowerCase();
    const matches = lib.filter(b=> !q || b.toLowerCase().includes(q));
    if(matches.length === 0){ listEl.style.display = "none"; listEl.innerHTML = ""; return; }
    listEl.innerHTML = matches.map(b=>`<div class="bullet-suggest-item">${escapeAttr(b)}</div>`).join("");
    listEl.style.display = "block";
    Array.prototype.forEach.call(listEl.querySelectorAll(".bullet-suggest-item"), (item, i)=>{
      item.onmousedown = (ev)=>{
        ev.preventDefault(); // fires before blur, so the click registers before the list hides
        inp.value = matches[i];
        listEl.style.display = "none";
        onCommit(inp.value, true);
      };
    });
  }
  inp.oninput = ()=>{ onCommit(inp.value, false); showSuggestions(); };
  inp.onfocus = showSuggestions;
  inp.onblur = ()=>{ setTimeout(()=>{ if(listEl) listEl.style.display = "none"; }, 150); };
}

function wireQuote(main){
  main.querySelector("#c_name").oninput = e=> state.customer.name = e.target.value;
  main.querySelector("#c_business").oninput = e=> state.customer.business = e.target.value;
  main.querySelector("#c_address").oninput = e=> state.customer.address = e.target.value;
  main.querySelector("#c_phone").oninput = e=> state.customer.phone = e.target.value;
  main.querySelector("#c_email").oninput = e=> state.customer.email = e.target.value;
  main.querySelector("#c_date").oninput = e=> state.proposalDate = e.target.value;
  main.querySelector("#p_title_select").onchange = e=>{ state.titleChoice = e.target.value; renderQuote(main); };
  const customTitleInp = main.querySelector("#p_title_custom");
  if(customTitleInp) customTitleInp.oninput = e=> state.customTitle = e.target.value;
  main.querySelector("#closing_text").oninput = e=> state.closingText = e.target.value;
  main.querySelector("#rep_name").oninput = e=> state.rep = e.target.value;
  main.querySelector("#rep_title").oninput = e=> state.repTitle = e.target.value;

  main.querySelector("#install_total").oninput = e=>{ state.installTotal = e.target.value; state.installDirty = true; };
  const monitorTotalInp = main.querySelector("#monitor_total");
  if(monitorTotalInp) monitorTotalInp.oninput = e=>{ state.monitorTotal = e.target.value; state.monitorDirty = true; };
  main.querySelector("#profit_select").onchange = e=>{ state.profitPercent = e.target.value; state.installDirty = false; renderQuote(main); };
  main.querySelector("#labor_rate_select").onchange = e=>{ state.laborRate = e.target.value; state.installDirty = false; renderQuote(main); };
  main.querySelector("#labor_techs").oninput = e=>{ state.laborTechs = e.target.value; state.installDirty = false; };
  main.querySelector("#labor_techs").onchange = ()=> renderQuote(main);
  main.querySelector("#labor_hours").oninput = e=>{ state.laborHours = e.target.value; state.installDirty = false; };
  main.querySelector("#labor_hours").onchange = ()=> renderQuote(main);

  main.querySelectorAll('.note-line-input').forEach(inp=>{
    wireSuggestInput(inp, main, (val)=>{
      const idx = parseInt(inp.dataset.idx,10);
      if(state.notes[idx]) state.notes[idx].text = val;
    });
  });
  main.querySelectorAll('.note-line-red').forEach(chk=>{
    chk.onchange = (e)=>{
      const idx = parseInt(e.target.dataset.idx,10);
      if(state.notes[idx]) state.notes[idx].red = e.target.checked;
    };
  });
  main.querySelectorAll('.note-line-rm').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      const removed = state.notes[idx];
      if(removed && removed.sourceId && !state.dismissedAutoNoteIds.includes(removed.sourceId)){
        state.dismissedAutoNoteIds.push(removed.sourceId);
      }
      state.notes.splice(idx,1);
      renderQuote(main);
    };
  });
  const addNoteBtn = main.querySelector('#addNoteBtn');
  if(addNoteBtn) addNoteBtn.onclick = ()=>{
    state.notes.push({ text:"", red:true });
    renderQuote(main);
  };

  main.querySelectorAll('[data-single-cat]').forEach(sel=>{
    sel.onchange = (e)=>{
      const catId = e.target.dataset.singleCat;
      clearCategory(catId);
      if(e.target.value){
        const cat = state.config.categories.find(c=>c.id===catId);
        const opt = cat.options.find(o=>o.id===e.target.value);
        const initialBullets = cat.qtyFromBullets ? [] : (opt.bullets||[]).slice();
        setSel(catId, e.target.value, {checked:true, qty:1, bullets:initialBullets, bulletsExpanded:false, bulletStyle: opt.bulletStyle||"list"});
      }
      state.installDirty = false; state.monitorDirty = false;
      reconcileConditionalSelections();
      applyAutoNotes();
      renderQuote(main);
    };
  });
  main.querySelectorAll('[data-multi-cat]').forEach(chk=>{
    chk.onchange = (e)=>{
      const catId = e.target.dataset.multiCat, optId = e.target.dataset.opt;
      if(e.target.checked){
        const cat = state.config.categories.find(c=>c.id===catId);
        const opt = cat.options.find(o=>o.id===optId);
        const initialBullets = cat.qtyFromBullets ? [] : (opt.bullets||[]).slice();
        setSel(catId, optId, {checked:true, qty:1, bullets:initialBullets, bulletsExpanded:false, bulletStyle: opt.bulletStyle||"list"});
      } else {
        setSel(catId, optId, {checked:false});
      }
      state.installDirty = false; state.monitorDirty = false;
      reconcileConditionalSelections();
      applyAutoNotes();
      renderQuote(main);
    };
  });
  main.querySelectorAll('[data-qty-cat]').forEach(inp=>{
    inp.oninput = (e)=>{
      setSel(e.target.dataset.qtyCat, e.target.dataset.qtyOpt, {qty: parseInt(e.target.value,10)||1});
      state.installDirty = false; state.monitorDirty = false;
    };
    inp.onchange = ()=> renderQuote(main);
  });
  main.querySelectorAll('.bullet-line-input').forEach(inp=>{
    wireSuggestInput(inp, main, (val, shouldRerender)=>{
      const catId = inp.dataset.cat, optId = inp.dataset.opt, idx = parseInt(inp.dataset.idx,10);
      const lines = bulletLines(getSel(catId, optId));
      lines[idx] = val;
      setSel(catId, optId, {bullets: lines});
      if(shouldRerender) renderQuote(main);
    });
    inp.onchange = ()=> renderQuote(main);
  });
  main.querySelectorAll('.save-lib-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const catId = btn.dataset.cat, optId = btn.dataset.opt, idx = parseInt(btn.dataset.idx,10);
      const cat = state.config.categories.find(c=>c.id===catId);
      const lines = bulletLines(getSel(catId, optId));
      const phrase = (lines[idx]||"").trim();
      if(cat && phrase){
        if(!cat.bulletLibrary) cat.bulletLibrary = [];
        const already = cat.bulletLibrary.some(b=>b.trim().toLowerCase()===phrase.toLowerCase());
        if(!already) cat.bulletLibrary.push(phrase);
        saveConfig();
        showToast("Added to library");
        renderQuote(main);
      }
    };
  });
  main.querySelectorAll('.bullet-show-checkbox').forEach(chk=>{
    chk.onchange = (e)=>{
      const catId = e.target.dataset.cat, optId = e.target.dataset.opt, idx = parseInt(e.target.dataset.idx,10);
      const s = getSel(catId, optId);
      const overrideArr = (s && Array.isArray(s.bulletShowOverride)) ? s.bulletShowOverride.slice() : [];
      while(overrideArr.length <= idx) overrideArr.push(null);
      overrideArr[idx] = e.target.checked;
      setSel(catId, optId, {bulletShowOverride: overrideArr});
    };
  });
  main.querySelectorAll('.bullet-line-rm').forEach(btn=>{
    btn.onclick = ()=>{
      const catId = btn.dataset.cat, optId = btn.dataset.opt, idx = parseInt(btn.dataset.idx,10);
      const s = getSel(catId, optId);
      const lines = bulletLines(s);
      lines.splice(idx,1);
      const addonsArr = (s && Array.isArray(s.bulletAddons)) ? s.bulletAddons.slice() : [];
      addonsArr.splice(idx,1);
      const overrideArr = (s && Array.isArray(s.bulletShowOverride)) ? s.bulletShowOverride.slice() : [];
      overrideArr.splice(idx,1);
      setSel(catId, optId, {bullets: lines, bulletAddons: addonsArr, bulletShowOverride: overrideArr});
      renderQuote(main);
    };
  });
  main.querySelectorAll('.bullet-add-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const catId = btn.dataset.cat, optId = btn.dataset.opt;
      const s = getSel(catId, optId);
      const lines = bulletLines(s);
      lines.push("");
      const addonsArr = (s && Array.isArray(s.bulletAddons)) ? s.bulletAddons.slice() : [];
      addonsArr.push([]);
      const overrideArr = (s && Array.isArray(s.bulletShowOverride)) ? s.bulletShowOverride.slice() : [];
      overrideArr.push(null);
      setSel(catId, optId, {bullets: lines, bulletAddons: addonsArr, bulletShowOverride: overrideArr, bulletsExpanded:true});
      renderQuote(main);
    };
  });
  main.querySelectorAll('.bullet-line-add').forEach(btn=>{
    btn.onclick = ()=>{
      const catId = btn.dataset.cat, optId = btn.dataset.opt, idx = parseInt(btn.dataset.idx,10);
      const cat = state.config.categories.find(c=>c.id===catId);
      const lib = (cat && cat.priceAddOns) || [];
      if(!lib.length) return;
      const s = getSel(catId, optId);
      const addonsArr = (s && Array.isArray(s.bulletAddons)) ? s.bulletAddons.map(r=>Array.isArray(r)?r.slice():[]) : [];
      while(addonsArr.length <= idx) addonsArr.push([]);
      addonsArr[idx].push({addonId: lib[0].id, qty: 1});
      setSel(catId, optId, {bulletAddons: addonsArr});
      renderQuote(main);
    };
  });
  main.querySelectorAll('.bullet-addon-select').forEach(sel=>{
