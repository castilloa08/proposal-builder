function exportDraft(){
  try{
    const currentType = state.proposalTypes.find(t=>t.id===state.currentTypeId);
    const draft = {
      draftVersion: 1,
      exportedAt: new Date().toISOString(),
      proposalTypeId: state.currentTypeId,
      proposalTypeName: currentType ? currentType.name : "",
      customer: state.customer,
      rep: state.rep,
      repTitle: state.repTitle,
      titleChoice: state.titleChoice,
      customTitle: state.customTitle,
      selections: state.selections,
      installTotal: state.installTotal,
      installDirty: state.installDirty,
      monitorTotal: state.monitorTotal,
      monitorDirty: state.monitorDirty,
      profitPercent: state.profitPercent,
      laborRate: state.laborRate,
      laborTechs: state.laborTechs,
      laborHours: state.laborHours,
      notes: state.notes,
      dismissedAutoNoteIds: state.dismissedAutoNoteIds,
      proposalDate: state.proposalDate
    };
    const blob = new Blob([JSON.stringify(draft, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (state.customer.name || "draft").replace(/[^a-z0-9]+/gi,"_");
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `Draft_${safeName}_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    showToast("Draft saved — reload it anytime with Load Draft");
  }catch(e){
    showToast("Could not save draft: " + (e.message||e));
  }
}

function importDraft(file, main){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const draft = JSON.parse(reader.result);
      if(!draft || typeof draft !== "object" || !draft.customer || !draft.selections){
        throw new Error("File doesn't look like a saved draft");
      }
      if(draft.proposalTypeId && draft.proposalTypeId !== state.currentTypeId){
        showToast(`Note: this draft was saved under "${draft.proposalTypeName||'a different proposal type'}" — some items may not match.`);
      }
      state.customer = Object.assign({ name:"", business:"", address:"", phone:"", email:"" }, draft.customer||{});
      state.rep = draft.rep || "";
      state.repTitle = draft.repTitle || "";
      state.titleChoice = draft.titleChoice || (state.config.titleOptions[0] || "__custom__");
      state.customTitle = draft.customTitle || "";
      state.selections = draft.selections || {};
      state.installTotal = draft.installTotal || "";
      state.installDirty = !!draft.installDirty;
      state.monitorTotal = draft.monitorTotal || "";
      state.monitorDirty = !!draft.monitorDirty;
      state.profitPercent = draft.profitPercent || "0";
      state.laborRate = draft.laborRate || "0";
      state.laborTechs = draft.laborTechs || 1;
      state.laborHours = draft.laborHours || 0;
      state.notes = Array.isArray(draft.notes) ? draft.notes : [];
      state.dismissedAutoNoteIds = Array.isArray(draft.dismissedAutoNoteIds) ? draft.dismissedAutoNoteIds : [];
      state.proposalDate = draft.proposalDate || state.proposalDate;
      showToast("Draft loaded");
      renderQuote(main);
    }catch(e){
      showToast("Could not load draft: " + (e.message||e));
    }
  };
  reader.readAsText(file);
}

/* ---------- PDF GENERATION ---------- */

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function wrapText(text, font, size, maxWidth){
  const words = String(text||"").split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = "";
  words.forEach(w=>{
    const test = cur? cur+" "+w : w;
    if(font.widthOfTextAtSize(test, size) > maxWidth){
      if(cur) lines.push(cur);
      cur = w;
    } else cur = test;
  });
  if(cur) lines.push(cur);
  return lines;
}

function leaderDots(font, size, availWidth){
  const dot = ".";
  const dotW = font.widthOfTextAtSize(dot, size);
  const n = Math.max(3, Math.floor(availWidth / dotW));
  return dot.repeat(n);
}

async function generatePartsListPdf(){
  if(!state.customer.name){ showToast("Enter a customer name first"); return; }
  state.generatingParts = true;
  render();

  try{
    const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
    const pdfDoc = await PDFDocument.create();
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const black = rgb(0.1,0.1,0.1);
    const gray = rgb(0.42,0.44,0.47);
    const navy = rgb(0.08,0.16,0.27);
    const brandRed = rgb(0.78,0.13,0.17);

    const pageSize = [612, 792];
    const marginX = 50, rightX = 562, minY = 50;

    function drawWatermark(pg){
      const wmText = "STOP ALARM USE ONLY";
      const wmSize = 40;
      const wmWidth = fontBold.widthOfTextAtSize(wmText, wmSize);
      pg.drawText(wmText, {
        x: pageSize[0]/2 - wmWidth/2,
        y: pageSize[1]/2 - 20,
        size: wmSize,
        font: fontBold,
        color: brandRed,
        rotate: degrees(40),
        opacity: 0.18
      });
    }

    let page = pdfDoc.addPage(pageSize);
    drawWatermark(page);
    let y = 742;

    function newPage(){ page = pdfDoc.addPage(pageSize); drawWatermark(page); y = 742; }
    function ensureSpace(needed){ if(y - needed < minY) newPage(); }
    function wrap(text, f, size, maxWidth){
      const words = String(text||"").split(/\s+/).filter(Boolean);
      const lines = []; let cur = "";
      words.forEach(w=>{
        const test = cur? cur+" "+w : w;
        if(f.widthOfTextAtSize(test,size) > maxWidth){ if(cur) lines.push(cur); cur = w; } else cur = test;
      });
      if(cur) lines.push(cur);
      return lines;
    }

    // Header
    page.drawText("PARTS LIST — INTERNAL USE ONLY", { x: marginX, y, size: 14, font: fontBold, color: brandRed });
    const dateNow = new Date().toLocaleDateString(undefined,{month:'2-digit',day:'2-digit',year:'numeric'});
    page.drawText(dateNow, { x: rightX - font.widthOfTextAtSize(dateNow,10), y, size: 10, font, color: gray });
    y -= 26;

    page.drawText(state.customer.name || "", { x: marginX, y, size: 12, font: fontBold, color: black });
    y -= 15;
    if(state.customer.business){
      page.drawText(state.customer.business, { x: marginX, y, size: 10.5, font, color: black });
      y -= 14;
    }
    if(state.customer.address){
      wrap(state.customer.address, font, 10.5, 400).forEach(l=>{
        page.drawText(l, { x: marginX, y, size: 10.5, font, color: black });
        y -= 14;
      });
    }
    if(state.customer.phone){ page.drawText(state.customer.phone, { x: marginX, y, size: 10.5, font, color: black }); y -= 14; }
    if(state.customer.email){ page.drawText(state.customer.email, { x: marginX, y, size: 10.5, font, color: black }); y -= 14; }

    y -= 8;
    page.drawLine({ start:{x:marginX,y}, end:{x:rightX,y}, thickness: 1, color: gray });
    y -= 20;

    const groups = computePartsListGroups();
    if(groups.length === 0){
      page.drawText("No items selected.", { x: marginX, y, size: 11, font, color: gray });
      y -= 16;
    }

    groups.forEach(group=>{
      ensureSpace(22);
      page.drawText(group.categoryName.toUpperCase(), { x: marginX, y, size: 11, font: fontBold, color: navy });
      y -= 16;

      group.items.forEach(it=>{
        ensureSpace(14);
        const qtyStr = it.qty > 1 ? `(${it.qty}) ` : "";
        wrap(`${qtyStr}${it.label}`, fontBold, 10, rightX - marginX - 14).forEach(l=>{
          ensureSpace(13);
          page.drawText(l, { x: marginX + 10, y, size: 10, font: fontBold, color: black });
          y -= 13;
        });

        it.bullets.forEach(b=>{
          if(b.text){
            ensureSpace(12);
            wrap("•  " + b.text, font, 9, rightX - marginX - 34).forEach(l=>{
              ensureSpace(12);
              page.drawText(l, { x: marginX + 26, y, size: 9, font, color: black });
              y -= 12;
            });
          }
          b.addons.forEach(a=>{
            ensureSpace(11);
            const qtyPart = a.qty > 1 ? `${a.qty}x ` : "";
            wrap(`+ ${qtyPart}${a.label}`, font, 8.5, rightX - marginX - 50).forEach(l=>{
              ensureSpace(11);
              page.drawText(l, { x: marginX + 42, y, size: 8.5, font, color: gray });
              y -= 11;
            });
          });
        });
        y -= 4;
      });
      y -= 8;
    });

    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (state.customer.name || "customer").replace(/[^a-z0-9]+/gi,"_");
    a.href = url;
    a.download = `PartsList_${safeName}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);

    showToast("Parts list PDF ready");
  }catch(e){
    console.error(e);
    showToast("Could not generate parts list: " + (e.message||e));
  }finally{
    state.generatingParts = false;
    render();
  }
}

async function generatePdf(){
  if(!state.customer.name){ showToast("Enter a customer name first"); return; }
  state.generating = true;
  render();

  try{
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const letterheadBytes = b64ToBytes(LETTERHEAD_PDF_B64);
    const pdfDoc = await PDFDocument.load(letterheadBytes);
    const letterheadPage = pdfDoc.getPages()[0];
    const { width, height } = letterheadPage.getSize();

    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const navy = rgb(0.08,0.16,0.27);
    const black = rgb(0.1,0.1,0.1);
    const gray = rgb(0.42,0.44,0.47);
    const brandRed = rgb(0.78,0.13,0.17);

    const marginX = 72; // aligned with the "O" in the "OF" of the letterhead logo
    const rightX = 533; // aligned with the horizontal center of the S.T.O.P. badge, bottom right
    const minY = 130; // keep clear of footer artwork/badge
    const qNumber = state.quoteNumber || (state.quoteNumber = await nextQuoteNumber());
    let dateStr = new Date().toLocaleDateString(undefined,{month:'2-digit',day:'2-digit',year:'numeric'});
    if(state.proposalDate){
      const parts = state.proposalDate.split("-"); // yyyy-mm-dd from <input type="date">
      if(parts.length === 3){ dateStr = `${parts[1]}/${parts[2]}/${parts[0]}`; }
    }

    const titleText = currentProposalTitle();

    let page = letterheadPage;
    let y = height - 145;
    let pageCount = 1;

    function newPage(){
      page = pdfDoc.addPage([width, height]);
      pageCount++;
      y = height - 60;
      const contHeader = `${state.customer.name} — ${titleText} (continued)`;
      page.drawText(truncateToWidth(contHeader, font, 9, rightX-marginX), {x:marginX, y, size:9, font, color:gray});
      y -= 22;
    }

    function ensureSpace(needed, floor){
      const useFloor = (typeof floor === "number") ? floor : minY;
      if(y - needed < useFloor) newPage();
    }

    function truncateToWidth(text, f, size, maxWidth){
      if(f.widthOfTextAtSize(text, size) <= maxWidth) return text;
      let t = text;
      while(t.length>1 && f.widthOfTextAtSize(t+"…", size) > maxWidth) t = t.slice(0,-1);
      return t + "…";
    }

    // Customer block — name, then business (if given), address, phone, email — each line only if filled
    // Date sits on the same line as the customer name, right-aligned, to save vertical space.
    page.drawText(dateStr, { x: rightX - font.widthOfTextAtSize(dateStr,10), y, size: 10, font, color: black });
    page.drawText(state.customer.name || "", { x: marginX, y, size: 11.5, font: fontBold, color: black });
    y -= 15;
    if(state.customer.business){
      page.drawText(state.customer.business, { x: marginX, y, size: 10.5, font, color: black });
      y -= 14;
    }
    if(state.customer.address){
      wrapText(state.customer.address, font, 10.5, 320).forEach(line=>{
        page.drawText(line, { x: marginX, y, size: 10.5, font, color: black });
        y -= 14;
      });
    }
    if(state.customer.phone){
      page.drawText(state.customer.phone, { x: marginX, y, size: 10.5, font, color: black });
      y -= 14;
    }
    if(state.customer.email){
      page.drawText(state.customer.email, { x: marginX, y, size: 10.5, font, color: black });
      y -= 14;
    }
    y -= 14;

    // Title (underlined)
    const title = titleText.toUpperCase();
    page.drawText(title, { x: marginX, y, size: 12.5, font: fontBold, color: black });
    const titleW = fontBold.widthOfTextAtSize(title, 12.5);
    page.drawLine({ start:{x:marginX,y:y-3}, end:{x:marginX+titleW,y:y-3}, thickness:0.9, color: black });
    y -= 26;

    // Lettered scope list
    const items = computeScopeItems();
    items.forEach((it, idx)=>{
      ensureSpace(16);
      const qtyPrefix = it.qty && it.qty > 1 ? `(${it.qty}) ` : "";
      const mainText = `${letterFor(idx)}.   ${qtyPrefix}${it.label}`.toUpperCase();
      const wrapped = wrapText(mainText, fontBold, 10, rightX - marginX - 4);
      wrapped.forEach((line,li)=>{
        ensureSpace(14);
        page.drawText(line, { x: marginX, y, size: 10, font: fontBold, color: black });
        y -= 14;
      });
      const style = it.bulletStyle || "list";
      const useInline = it.bullets.length > 0 && style === "inline";
      if(useInline){
        const line = it.bullets.map((b,bi)=> `(${letterFor(bi)}) ${b.toUpperCase()}`).join("   ");
        wrapText(line, fontBold, 9.5, rightX - marginX - 30).forEach(l=>{
          ensureSpace(13);
          page.drawText(l, { x: marginX + 30, y, size: 9.5, font: fontBold, color: black });
          y -= 13;
        });
      } else {
        it.bullets.forEach(b=>{
          ensureSpace(13);
          const bText = "•  " + b.toUpperCase();
          wrapText(bText, fontBold, 9.5, rightX - marginX - 34).forEach(line=>{
            ensureSpace(13);
            page.drawText(line, { x: marginX + 30, y, size: 9.5, font: fontBold, color: black });
            y -= 13;
          });
        });
      }
      y -= 3;
    });

    if(items.length === 0){
      page.drawText("(No scope items selected)", { x: marginX, y, size: 9.5, font, color: gray });
      y -= 14;
    }

    // Customer-specific notes (each centered, optionally red)
    const notesToPrint = currentCustomerNotes();
    if(notesToPrint.length){
      y -= 10;
      notesToPrint.forEach(n=>{
        ensureSpace(20);
        const noteColor = n.red ? brandRed : black;
        wrapText(n.text, fontBold, 10.5, (rightX - marginX) * 0.85).forEach(line=>{
          ensureSpace(15);
          const lineW = fontBold.widthOfTextAtSize(line, 10.5);
          const centerX = marginX + ((rightX - marginX) - lineW) / 2;
          page.drawText(line, { x: centerX, y, size: 10.5, font: fontBold, color: noteColor });
          y -= 15;
        });
        y -= 4;
      });
    }

    y -= 16;
    ensureSpace(50);

    // Pricing lines with dotted leaders
    const ds = state.config.documentSettings;
    const priceX = marginX + 20;
    const priceColRight = rightX;
    function drawPriceLine(label, amount){
      ensureSpace(16);
      const labelText = label.toUpperCase();
      page.drawText(labelText, { x: priceX, y, size: 10.5, font: fontBold, color: black });
      const amtText = fmtMoney(amount);
      const amtW = fontBold.widthOfTextAtSize(amtText, 10.5);
      const labelW = fontBold.widthOfTextAtSize(labelText, 10.5);
      const dotsAvail = (priceColRight - amtW) - (priceX + labelW) - 6;
      if(dotsAvail > 10){
        const dots = leaderDots(font, 10.5, dotsAvail);
        page.drawText(dots, { x: priceX + labelW + 3, y, size: 10.5, font, color: black });
      }
      page.drawText(amtText, { x: priceColRight - amtW, y, size: 10.5, font: fontBold, color: black });
      y -= 17;
    }
    drawPriceLine(ds.installationLabel, parseFloat(state.installTotal)||0);
    if(ds.showMonitoringLine !== false){
      drawPriceLine(ds.monitoringLabel, parseFloat(state.monitorTotal)||0);
    }

    y -= 22;

    // Closing paragraph
    const closing = (state.closingText||"").replace(/\{phone\}/gi, ds.contactPhone||"");
    if(closing.trim()){
      ensureSpace(40);
      wrapText(closing, font, 10, rightX - marginX).forEach(line=>{
        ensureSpace(13);
        page.drawText(line, { x: marginX, y, size: 10, font, color: black });
        y -= 13;
      });
    }

    y -= 16;
    let sigHeight = 32; // "Sincerely," line + gap before name
    if(state.rep) sigHeight += 14;
    if(state.repTitle) sigHeight += 14;
    if(ds.companyName) sigHeight += 14;
    ensureSpace(sigHeight, 45); // signature block is short & left-aligned, so it can sit lower than general body text
    page.drawText("Sincerely,", { x: marginX, y, size: 10.5, font, color: black });
    y -= 32;
    if(state.rep){ page.drawText(state.rep, { x: marginX, y, size: 10.5, font, color: black }); y -= 14; }
    if(state.repTitle){ page.drawText(state.repTitle, { x: marginX, y, size: 10.5, font, color: black }); y -= 14; }
    if(ds.companyName){ page.drawText(ds.companyName, { x: marginX, y, size: 10.5, font, color: black }); y -= 14; }

    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (state.customer.name || "customer").replace(/[^a-z0-9]+/gi,"_");
    a.href = url;
    a.download = `Proposal_${qNumber}_${safeName}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);

    showToast("Proposal PDF ready — check your downloads");
  }catch(e){
    console.error(e);
    showToast("Could not generate PDF: " + (e.message||e));
  }finally{
    state.generating = false;
    render();
  }
}

/* ---------------- INIT ---------------- */
let needsSetup = false;
if(!IS_CLAUDE_STORAGE){
  try{ needsSetup = localStorage.getItem("SYNC_SETUP_DONE") !== "1"; }catch(e){ needsSetup = false; }
}
if(needsSetup){
  state.view = "syncSetup";
  render();
} else {
  render();
  loadAllTypes();
}

if(!IS_CLAUDE_STORAGE && "serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("/sw.js").catch(()=>{ /* fine if this fails, e.g. no HTTPS */ });
  });
}
</script>
